    notes: |
      ## 已知考点 (基于二面真实面经 PDF 2026-06-12)

      ### 二面整体特点
      - **时长**: 45-60 min
      - **风格**: 深挖项目 + 分布式/中间件深问 + 内容安全场景设计 + 1 道中等 coding
      - **重点**: 高并发、幂等、风控链路、数据一致性、可观测性
      - **语言**: TikTok 后端 Go 为主, Java 也可

      ### 二面 8 大模块 (附时长占比)
      1. **项目深挖** (30 min+): 业务背景→角色→技术选型→流程→难点→优化→上线效果→复盘
      2. **Redis 高频题**: 数据结构选型 / 缓存一致性 / 击穿穿透雪崩 / 分布式锁
      3. **Kafka 必问**: 不丢不重 (ACK+幂等+死信队列) / 高吞吐底层 / Rebalance / Exactly-Once
      4. **QPS 压测**: JMeter / 瓶颈定位 / 优化套路
      5. **Bug 排查模板**: 现象→排查 (日志/链路/监控)→临时方案 (降级熔断)→根因→长效
      6. **Go 技术栈** (TikTok 主力): GMP / channel / sync.Map / 逃逸分析 / GC 三色标记
      7. **Java 备选**: ConcurrentHashMap 1.7/1.8 / 线程池 / ThreadLocal / JVM / Spring 事务
      8. **内容安全设计题 (40 分, 必考)**:
         - 高并发审核架构 (5 层)
         - 千万级敏感词 (AC 自动机 + 双实例热更新 + 多语言)
         - 误判率排查 (数据/规则/模型/链路)
         - 多地域差异化合规
         - QPS 突增应急 (5 招应急 + 3 招根治)
         - 人工任务分发 (任务池/状态机/幂等/监控)

      ### 二面常考算法 (中等, 15 min)
      - **AC 自动机 / 多模式匹配** (敏感词, 真题 Go 实现)
      - **滑动窗口** (最长无重复子串)
      - **TopK** (高频敏感词统计 → 哈希计频 + 小顶堆)
      - **字符串处理** (多语言分词、正则匹配)
      - **二叉树层序遍历**

      ### 二面软素质 (10 min)
      1. 为什么来 TikTok 内容安全? 为什么不选其他团队?
      2. 内容安全压力大、应急多, 你怎么看?
      3. 和产品/算法意见不一致, 怎么沟通?
      4. 你觉得内容安全后端最重要的三个特质?
      5. 职业规划: 短期/长期, 想深耕技术还是业务?

      ### 二面反问 3 个高质量
      1. 团队目前在多语言/多国家合规上最大的技术挑战是什么?
      2. 实习生入职后主要负责审核引擎/规则平台/数据链路哪块?培养路径?
      3. 团队线上应急机制是怎样的?实习生会参与吗?

      ## 跟前一个 (TnS 训练系统) 岗位的关键差别
      这个岗**纯后端 SDE**, 不是 ML 工程. 重点考:
      - **CS 基础硬实力** (数据结构/算法/OS/Network/DB) — TnS 那个是大模型训练系统
      - **高并发 + 高可靠后端架构** (限流/熔断/CAP/Raft/Kafka/微服务) — TnS 那个是分布式训练
      - **跟算法/MLOps 团队协作** — TnS 那个是写训练系统本身
      - **内容审核业务理解 + Go 主力** — TnS 那个是 Python + 大模型

      ## 准备策略
      1. **手撕**: LeetCode 中等 50 题打底 + AC 自动机 / TopK / 滑动窗口
      2. **CS 八股**: TCP/HTTP/MVCC/B+树/InnoDB锁/Redis/Kafka/分布式事务 必背
      3. **系统设计**: 高并发审核 / 千万级敏感词 / 多地域合规 (二面 40 分必考)
      4. **简历改写**: LuxRent 微服务 + UAES OTA 系统设计 + Code Review 工程能力
      5. **Go**: 不会 Java 没事, **Go 一定要熟** (GMP/channel/逃逸分析/GC)
      6. **业务理解**: 多模态 / 实时性 / 召回 > 精度 / 多语言 / 人机 hybrid / 隐私

      ## 通关关键 (从 PDF 抄)
      - 项目讲透细节, 不泛泛而谈
      - 分布式 / 中间件原理 + 场景 + 问题 + 解决闭环
      - 内容安全设计题紧扣业务, 体现风控思维
      - 算法能写能讲, 代码干净
      - 软素质匹配字节务实、严谨、抗压文化
